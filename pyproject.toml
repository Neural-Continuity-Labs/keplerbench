[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keplerbench"
version = "0.2.0"
description = "A benchmark for scientific discovery from observer-centered astronomical observations: Tycho's Mars record and synthetic worlds, scored on prediction, global law and local law"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
historical = ["pandas>=2.0", "xlrd>=2.0"]
pilot = ["scipy>=1.10"]
figures = ["matplotlib>=3.7"]

[project.scripts]
keplerbench = "keplerbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/pilot/tests"]
markers = ["slow: takes more than about ten seconds"]
